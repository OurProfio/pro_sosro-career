services:
  # ---------------------------------------------
  # Application Service (PHP 8.4-FPM)
  # ---------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sosro_career_app
    restart: unless-stopped
    working_dir: /var/www
    env_file:
      - .env
    volumes:
      - ./.env:/var/www/.env
      - storage_data:/var/www/storage
    networks:
      - sosro_network
    depends_on:
      - db

  # ---------------------------------------------
  # Web Server (Nginx)
  # ---------------------------------------------
  web:
    image: nginx:alpine
    container_name: sosro_career_web
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - .:/var/www:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - storage_data:/var/www/storage:ro
    networks:
      - sosro_network
    depends_on:
      - app

  # ---------------------------------------------
  # Background Queue Worker (Mails & Jobs)
  # ---------------------------------------------
  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sosro_career_queue
    restart: unless-stopped
    command: php artisan queue:work --sleep=3 --tries=3 --timeout=90
    working_dir: /var/www
    env_file:
      - .env
    volumes:
      - ./.env:/var/www/.env
      - storage_data:/var/www/storage
    networks:
      - sosro_network
    depends_on:
      - app

  # ---------------------------------------------
  # Cron Scheduler (Task Scheduling)
  # ---------------------------------------------
  cron:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sosro_career_cron
    restart: unless-stopped
    command: sh -c "while true; do php artisan schedule:run --verbose --no-interaction & sleep 60; done"
    working_dir: /var/www
    env_file:
      - .env
    volumes:
      - ./.env:/var/www/.env
      - storage_data:/var/www/storage
    networks:
      - sosro_network
    depends_on:
      - app

  # ---------------------------------------------
  # Database Service (MySQL 8.0)
  # ---------------------------------------------
  db:
    image: mysql:8.0
    container_name: sosro_career_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-pro_sosro-career}
      MYSQL_USER: ${DB_USERNAME:-sosro_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-sosro_secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - sosro_network

# -----------------------------------------------
# Persistent Volumes & Networks
# -----------------------------------------------
volumes:
  storage_data:
    driver: local
  db_data:
    driver: local

networks:
  sosro_network:
    driver: bridge
